# Ruff at every commit, from its own mirror rather than from the project's venv.
#
# A `repo: local` hook calling `uv run ruff` was the first idea and is wrong for this
# repository: it needs a synced project environment in whichever worktree the commit
# is made from, and this repo is worked in three of them -- one of which has no venv
# at all -- so committing there would sync the whole langchain stack to check
# formatting. The mirror builds its own isolated environment from the rev below,
# needs neither uv nor a venv, and behaves identically in CI and on a fresh clone.
#
# `rev` here and the `ruff` pin in pyproject's dev group MUST MOVE TOGETHER. Ruff's
# formatter output can change between minor releases, so an open range in one place
# and a pin in the other is churn waiting to happen -- which is exactly how eight
# files came to be unformatted while `ruff check` stayed green. Both say 0.16.6, and
# the tree was formatted by 0.16.6; 0.16.3, the version installed when this landed,
# agrees on every file here, which is how the pin was chosen without a flag day.
# `pre-commit install` with no flags installs these three, so one install covers the
# commit hook and the two full-suite ones. A checkout that installed before they were
# added needs `uv run pre-commit install` again -- the hooks live in `.git/hooks`,
# which worktrees share, so once per clone.
default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Deliberately no `--fix`. A formatter rewriting layout at commit time is
      # fine; a linter rewriting logic is an edit nobody read. If `--fix` is ever
      # wanted, it has to come before the formatter hook -- ruff's own README says
      # its fixes can produce code that then needs reformatting.
      - id: ruff-check
      - id: ruff-format

  # The one irreversible mistake this project can make is committing the corpus:
  # 21 MB of data whose licensing is unresolved, into a history that is pushed to
  # more than one remote and cannot be un-pushed. Three things already guard it --
  # `.gitignore`, `guard.py`'s refusal to *write* where git would track, and the
  # convention of keeping the data outside the checkout -- and all three depend on
  # a path being predicted correctly in advance. This one asks a different
  # question, at the last moment before the mistake becomes permanent: is anything
  # being added unusually large? A corpus, an export, a results file or a sqlite
  # store all fail it; no source file in this repository comes close.
  #
  # 1 MB, not the default 500 kB: `uv.lock` is committed deliberately and is already
  # 498 kB, so the default would start refusing it on roughly its next dependency.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]

  # The test loop, in two tiers. See `bin/testloop.py` for the reasoning; the short
  # version is that testmon makes a commit cheap by running only what the change
  # reaches, and is blind to files a test merely reads, so it is never the last word.
  #
  # `language: system` and not a mirror, unlike ruff above: tests need this project's
  # own environment. That is the cost the ruff comment warns about, paid here
  # deliberately, and `bin/testloop.py` is stdlib-only and says "NOT RUN" rather than
  # failing in the checkout that has no venv -- so the first person to commit from
  # there is told, not blocked into disabling the hook.
  - repo: local
    hooks:
      - id: testloop-commit
        name: tests the change reaches (testmon; full suite if a non-Python file changed)
        entry: bin/testloop.py commit
        language: system
        pass_filenames: true
        require_serial: true
        verbose: true
      # The full suite, in parallel, where a mistake leaves the machine or lands on
      # an integration branch. CI runs the same thing on the pushed commit; this
      # catches it a minute earlier and without a round trip.
      - id: testloop-full
        name: full test suite (parallel)
        entry: bin/testloop.py full
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        verbose: true
        stages: [pre-push, pre-merge-commit]
