[project]
name = "bionumbers"
version = "0.1.0"
description = "A database of useful biological numbers assembled from the literature, with provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Each work package declares its own dependencies as an extra, so installing one
# does not pull in the other's stack, and so the two branches edit different
# tables instead of the same line.
#   uv sync --extra validator
#   uv sync --extra ask
#   uv sync --extra ingest
[project.optional-dependencies]
validator = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "lxml>=5.2",
    "pint>=0.24",
]
ask = [
    "langchain>=1.1",
    "langgraph",
    # SqliteSaver ships separately from langgraph; the file-backed checkpointer
    # is load-bearing here, so it is a direct dependency rather than an option.
    "langgraph-checkpoint-sqlite",
    "langchain-openai",
    "streamlit",
    # The usage and feedback store. Streamlit's own `st.connection("sql")` is
    # SQLAlchemy-backed, and it is preferred over a hand-rolled connection
    # because it caches the engine at global scope across sessions -- without
    # that, every rerun would pay TCP, TLS and Postgres auth before its INSERT.
    "sqlalchemy>=2.0",
    # `[binary]` for the prebuilt wheel: the host has no libpq to build against,
    # and a source build would fail at deploy time rather than here.
    "psycopg[binary]>=3.2",
]
ingest = [
    "pydantic>=2.6",
]
# Additive to `ask`, not a replacement for it: the evaluation harness is a third
# adapter over the same agent, so it needs the `ask` stack to run at all, and this
# extra carries only what is new. Install both:
#   uv sync --extra ask --extra eval
# `deepeval` is used by one module, for the judged layer alone (ADR-0500). A
# deterministic evaluation run needs none of it, which is why it is separable.
eval = [
    "deepeval>=4.2",
]

# All three entry points are declared here so no branch has to edit this table.
# Console scripts are metadata resolved when invoked, so the ones whose modules
# are absent on a given branch are simply never run there.
[project.scripts]
bionumbers = "bionumbers.cli:main"
scinumbers-ask = "scinumbers_ask.cli:main"
bionumbers-ingest = "bionumbers_ingest.cli:main"
scinumbers-eval = "scinumbers_ask.eval_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Coverage is used here as a discovery tool, not a target: it answers "which
    # lines does no test ever run", which is the signature of a real path hidden
    # behind an injected fake.
    "pytest-cov>=5.0",
    # Pinned exactly, and the pin is paired: `.pre-commit-config.yaml` names the
    # same version. Ruff's formatter output can change between minor releases, so a
    # range here and a pin there means the hook and the venv eventually disagree and
    # every commit carries reformatting churn. Bump both or neither.
    "ruff==0.16.6",
    # So `uv run pre-commit install` works from a synced checkout. Open range on
    # purpose: this tool runs the hooks, it does not rewrite code, so its version
    # cannot move formatting under anyone.
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Deliberately not an enumerated package list. Each work package lives on its own
# branch with only its own source tree, so listing both would break the build on
# both branches until they merge. Including src/ wholesale packages whatever is
# present, which is correct on either branch and after they converge.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the doubles in tests/ directly, and default to offline.
pythonpath = ["tests"]
# `-p no:deepeval` because the `eval` extra installs DeepEval, which registers a
# pytest plugin that prints "Running teardown with pytest sessionfinish..." after
# every run -- including runs that touch none of its code. Collection is unchanged;
# it is the output that moved, and a line that appears only for developers who
# installed one extra makes "the suite output is unchanged" unverifiable. Harmless
# where deepeval is absent: `-p no:<name>` for an uninstalled plugin is not an error,
# which matters because this file is shared by all three work packages.
addopts = "-m 'not network and not corpus' -p no:deepeval"
markers = [
    "network: hits a real external service; run with `pytest -m network`",
    # The corpus is an external input kept out of the repository (ADR-0170), so
    # the default suite runs on the six-entry fixture -- which is exactly the
    # blind spot these checks exist to cover.
    "corpus: needs a real corpus at SCINUMBERS_CORPUS; run with `pytest -m corpus`",
    # Spawns a real subprocess. Five such tests are 30 per cent of the suite's
    # runtime, and a fault-seeding or mutation run pays that for every mutant --
    # neither can reach a subprocess boundary from a parser change. NOT deselected by
    # default: a person running the suite once must still execute them. It is there so
    # a harness re-running it hundreds of times can say `-m "not slow"`.
    #
    # **A second `-m` replaces this file's `addopts` expression, it does not AND with
    # it.** `-m "not slow"` re-selects `network` and `corpus`, which then make real API
    # calls and need a corpus -- the run gets slower, which is the opposite of the
    # intent and looks like nothing is wrong. Write the whole expression:
    #     pytest -m "not network and not corpus and not slow"    # 34s, vs 63s
    "slow: spawns a subprocess; kept in the default run, excluded by repeated-run harnesses",
]

# Linting and formatting, both from ruff: `ruff check` finds problems, `ruff
# format` rewrites layout. The config lives here on dev so both work packages
# lint against the same rules; each branch fixes its own tree after merging,
# since dev carries no source of its own.
[tool.ruff]
line-length = 100
target-version = "py312"

# E/F are the pycodestyle+pyflakes core, I keeps imports ordered, UP keeps the
# syntax current with the floor in requires-python, and B (bugbear) flags the
# patterns that fail silently -- which is the failure mode this project cannot
# afford. Deliberately no style-opinion families (SIM/C4/RET): they found one
# thing across the whole codebase, and it read worse than what was there.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Without this ruff reads the packages as third-party and removes the blank line
# separating them from real third-party imports, making every test file worse.
[tool.ruff.lint.isort]
known-first-party = ["bionumbers", "scinumbers_ask", "bionumbers_ingest", "agent_doubles"]
