[project]
name = "bionumbers"
version = "0.1.0"
description = "A database of useful biological numbers assembled from the literature, with provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Each work package declares its own dependencies as an extra, so installing one
# does not pull in the other's stack, and so the two branches edit different
# tables instead of the same line.
#   uv sync --extra validator
#   uv sync --extra ask
[project.optional-dependencies]
validator = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "lxml>=5.2",
    "pint>=0.24",
]
ask = [
    "langchain>=1.1",
    "langgraph",
    "langchain-openai",
    "streamlit",
]

# Both entry points are declared here so neither branch has to edit this table.
# Console scripts are metadata resolved when invoked, so the one whose module is
# absent on a given branch is simply never run there.
[project.scripts]
bionumbers = "bionumbers.cli:main"
bionumbers-ask = "bionumbers_ask.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Deliberately not an enumerated package list. Each work package lives on its own
# branch with only its own source tree, so listing both would break the build on
# both branches until they merge. Including src/ wholesale packages whatever is
# present, which is correct on either branch and after they converge.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the doubles in tests/ directly, and default to offline.
pythonpath = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits a real external service; run with `pytest -m network`"]
