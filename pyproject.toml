[project]
name = "bionumbers"
version = "0.1.0"
description = "Grounding validator: decide whether a source document supports a claimed quantity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "lxml>=5.2",
    "pint>=0.24",
]

[project.scripts]
bionumbers = "bionumbers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bionumbers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the doubles in tests/ directly, and default to offline.
pythonpath = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits the real Europe PMC; run with `pytest -m network`"]
