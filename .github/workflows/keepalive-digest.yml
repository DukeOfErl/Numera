name: keepalive-digest

# One mail a day instead of one per failed hour. `keepalive` runs hourly and fails
# loudly, but GitHub's own failure mail is switched off for the account
# (Settings > Notifications > Actions > "Don't notify"), so this is the notice:
# it looks back over the last 24 hours and writes to ONE standing issue, which is
# what mails the owner. Nothing to say, nothing written.
#
# Two things count as a problem, and the second is the one a failure mail can never
# report: runs that failed, and *no runs at all* -- GitHub pauses scheduled
# workflows after 60 days without repository activity, and a stopped check looks
# exactly like a passing one.
#
# Like `keepalive`, this runs from the default branch only.
on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "keepalive problems"
    steps:
      - name: Summarise the last 24 hours
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --workflow keepalive.yml --created ">=$since" --limit 100 \
            --json conclusion,url > runs.json
          # `cancelled` and in-progress runs are neither: only a conclusion that
          # says the app was not served counts against it.
          total=$(jq 'length' runs.json)
          failed=$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length' runs.json)
          {
            if [ "$total" -eq 0 ]; then
              echo "No keepalive run in the last 24 hours. The schedule may have been paused (GitHub does so after 60 days without repository activity) -- re-enable it from the Actions tab."
            elif [ "$failed" -gt 0 ]; then
              echo "$failed of $total keepalive runs failed in the last 24 hours:"
              echo
              jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .url' runs.json
            fi
          } > report.md
      - name: Write to the standing issue
        run: |
          [ -s report.md ] || exit 0
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
