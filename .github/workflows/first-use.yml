name: first-use

# Tells the operator, once per reader, when a reader is first seen signing in and when
# they first ask a question (ADR-1250). The command is silent when nobody is new, and
# so is this -- with one exception: after seven days with nothing delivered, one message
# says the check found no new readers, so a quiet week can be told apart from a broken
# check (ADR-1350).
#
# Delivery is a comment on ONE standing issue, which mails the owner through GitHub --
# no mail account, no mail secret (ADR-1270). That relies on the owner watching the
# repository or being mentioned (every comment mentions the owner for that reason),
# and a `test` run delivered mail on 2026-10-03 (ADR-1270). Run it by hand with `test`
# ticked to check it again.
#
# **Readers' addresses go into that comment, and nowhere else**: the command writes its
# report to a file, never to the log. (The exclusion list is the operator's own addresses,
# not a reader's, and Actions prints step env values in the log.) That is acceptable only while the repository is
# private -- an issue on a public repository is public, and so are its comments
# (ADR-1280). Do not make this repository public without removing this workflow.
#
# Scheduled workflows run from the default branch only, and GitHub may delay or skip
# a tick -- in practice it fires every 4-7 hours, which is why the window is computed
# from the previous successful run and not fixed (ADR-1290). A failing run is reported by `keepalive-digest`, because GitHub's own
# failure mail is off for this account.
on:
  schedule:
    # Off the top of the hour, where scheduled runs queue, and off keepalive's :17.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Also post one marked test line, to see that the mail arrives"
        type: boolean
        default: false

concurrency:
  group: first-use
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only: the window starts at the previous successful run, which is read out of
  # the run history (ADR-1290).
  actions: read
  issues: write

jobs:
  first-use:
    # Pinned, not `ubuntu-latest`, for the reason `keepalive.yml` gives.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "first use"
      # The URL of a role that can read the trail and nothing else
      # (`sql/first_use_reader.sql`). Deliberately not the Neon API key, which
      # can delete the project and is not held by any scheduled job.
      NUMERA_TRAIL_READ_URL: ${{ secrets.NUMERA_TRAIL_READ_URL }}
      # The operator's own and test addresses, comma-separated. A repository
      # variable and not a literal here, so no address is in a committed file.
      EXCLUDE: ${{ vars.FIRST_USE_EXCLUDE }}
      TEST: ${{ inputs.test }}
      # Mentioned in every comment: the issue is opened by the Actions bot, so the
      # owner is not "participating" in it, and mail under "Participating and
      # @mentions" would never come. A mention is exactly what that setting does
      # notify on. (For a repository owned by an organisation this names the
      # organisation, not a person -- revisit if it ever moves.)
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Ask who is new
        run: |
          args=()
          IFS=',' read -ra addresses <<< "${EXCLUDE:-}"
          for address in "${addresses[@]}"; do
            address="${address// /}"
            [ -n "$address" ] && args+=(--exclude "$address")
          done
          # **The window is "since the previous successful run", not a fixed hour.**
          # GitHub runs this schedule every 4-7 hours, not hourly, and a fixed 70-minute
          # window saw about a quarter of arrivals. So ask GitHub when the last success
          # began and look back that far, plus a few minutes of overlap. A failed or
          # cancelled run is not a success, so the next one covers its gap. With no
          # earlier success the command's own default applies (`DEFAULT_MINUTES`); the
          # cap stops a long outage turning into one enormous first report.
          last=$(gh run list --workflow first-use.yml --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ]; then
            minutes=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 + 6 ))
            [ "$minutes" -gt 10080 ] && minutes=10080
            args+=(--minutes "$minutes")
          fi
          # Only what the command imports: it needs a database driver and not the
          # model stack the `ask` extra carries, which would be a minute of install
          # 24 times a day. The versions are exact -- those in `uv.lock` -- because this job holds
          # the database URL and a floating release would run with it; move them with the lock.
          # The report goes to a file so no reader's address reaches the log.
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==2.0.52" --with "psycopg[binary]==3.3.5" \
            python -m numera_ask.first_use "${args[@]}" > report.md
      - name: Tell the operator
        run: |
          if [ "$TEST" = "true" ]; then
            { echo "TEST -- first-use mail check, $(date -u +%Y-%m-%dT%H:%MZ). Nobody arrived."; cat report.md; } > marked.md
            mv marked.md report.md
          fi
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ ! -s report.md ]; then
            # Nobody new. Say nothing -- except once a quiet week, so that the absence of
            # mail can be told apart from a check that has stopped working (ADR-1350).
            # With no standing issue there is nothing to measure the week from: the
            # first post creates it and starts the clock.
            [ -n "$number" ] || exit 0
            # The last delivery is the newest of the issue's creation and its comments,
            # whatever they were: a report, a test line, an earlier message of this kind.
            # The issue is the state; nothing is written anywhere else. A failed read
            # fails the step (bash -e) rather than looking like a quiet week.
            last=$(gh issue view "$number" --json createdAt,comments \
              --jq '[.createdAt, .comments[].createdAt] | max')
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            [ "$age" -ge 604800 ] || exit 0
            since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            checks=$(gh run list --workflow first-use.yml --status success \
              --created ">=$since" --limit 200 --json createdAt --jq 'length')
            # What the check *found*, not a claim that nobody exists; and the count
            # includes this run, which is not a success until it ends.
            {
              echo "This check ran at $(date -u +'%Y-%m-%d %H:%M UTC'). It found no new readers in the last 7 days."
              echo "$((checks + 1)) checks completed in that time, this one included. If you expected someone, the check may be what is wrong, not the readers."
            } > report.md
          fi
          { echo "@$OWNER"; echo; cat report.md; } > body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
