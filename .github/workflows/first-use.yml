name: first-use

# Tells the operator, once per reader, when a reader is first seen signing in and when
# they first ask a question (ADR-1250). The command is silent when nobody is new, and
# so is this: a run with nothing to say writes nothing anywhere.
#
# Delivery is a comment on ONE standing issue, which mails the owner through GitHub --
# no mail account, no mail secret (ADR-1270). That relies on the owner watching the
# repository or being mentioned (every comment mentions the owner for that reason),
# and neither has been shown for this account: run it by hand with `test` ticked and
# see the mail arrive before relying on it.
#
# **Readers' addresses go into that comment, and nowhere else**: the command writes its
# report to a file, never to the log. (The exclusion list is the operator's own addresses,
# not a reader's, and Actions prints step env values in the log.) That is acceptable only while the repository is
# private -- an issue on a public repository is public, and so are its comments
# (ADR-1280). Do not make this repository public without removing this workflow.
#
# Scheduled workflows run from the default branch only, and GitHub may delay or skip
# a tick; the window in `first_use.DEFAULT_MINUTES` is longer than an hour for that
# reason. A failing run is reported by `keepalive-digest`, because GitHub's own
# failure mail is off for this account.
on:
  schedule:
    # Off the top of the hour, where scheduled runs queue, and off keepalive's :17.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Also post one marked test line, to see that the mail arrives"
        type: boolean
        default: false

concurrency:
  group: first-use
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  first-use:
    # Pinned, not `ubuntu-latest`, for the reason `keepalive.yml` gives.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "first use"
      # The URL of a role that can read the trail and nothing else
      # (`sql/first_use_reader.sql`). Deliberately not the Neon API key, which
      # can delete the project and is not held by any scheduled job.
      SCINUMBERS_TRAIL_READ_URL: ${{ secrets.SCINUMBERS_TRAIL_READ_URL }}
      # The operator's own and test addresses, comma-separated. A repository
      # variable and not a literal here, so no address is in a committed file.
      EXCLUDE: ${{ vars.FIRST_USE_EXCLUDE }}
      TEST: ${{ inputs.test }}
      # Mentioned in every comment: the issue is opened by the Actions bot, so the
      # owner is not "participating" in it, and mail under "Participating and
      # @mentions" would never come. A mention is exactly what that setting does
      # notify on. (For a repository owned by an organisation this names the
      # organisation, not a person -- revisit if it ever moves.)
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Ask who is new
        run: |
          args=()
          IFS=',' read -ra addresses <<< "${EXCLUDE:-}"
          for address in "${addresses[@]}"; do
            address="${address// /}"
            [ -n "$address" ] && args+=(--exclude "$address")
          done
          # Only what the command imports: it needs a database driver and not the
          # model stack the `ask` extra carries, which would be a minute of install
          # 24 times a day. The versions are exact -- those in `uv.lock` -- because this job holds
          # the database URL and a floating release would run with it; move them with the lock.
          # The report goes to a file so no reader's address reaches the log.
          PYTHONPATH=src uv run --no-project \
            --with "sqlalchemy==2.0.52" --with "psycopg[binary]==3.3.5" \
            python -m scinumbers_ask.first_use "${args[@]}" > report.md
      - name: Tell the operator
        run: |
          if [ "$TEST" = "true" ]; then
            { echo "TEST -- first-use mail check, $(date -u +%Y-%m-%dT%H:%MZ). Nobody arrived."; cat report.md; } > marked.md
            mv marked.md report.md
          fi
          [ -s report.md ] || exit 0
          { echo "@$OWNER"; echo; cat report.md; } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
