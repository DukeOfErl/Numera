name: checks

# Every branch, not only the default one. A Streamlit Cloud app tracks a *branch
# tip*, so a green tick on `main` says nothing about the commit that is actually
# serving -- and a push to the deployment branch redeploys whether this passes or
# not. This reports; it does not gate. Nothing here can stop a bad deploy, and
# treating it as though it could is the way to be surprised by one.
on:
  push:
  pull_request:

# One run per ref: a second push supersedes the first, and a check still grinding
# for a commit nobody is serving any more is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Through pre-commit, so the rev pinned in .pre-commit-config.yaml is the
      # single arbiter of formatting: a developer whose local ruff has wandered
      # from the pin is told here instead of quietly committing churn. Needs none
      # of the project's own dependencies, so it finishes in seconds.
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Both extras. `--extra ask` alone leaves the ingester's tests failing at
      # import, and the offline suite covers both packages.
      - run: uv sync --extra ask --extra ingest
      # `addopts` already deselects the `network` and `corpus` markers, so nothing
      # here reaches a provider or needs the 21 MB corpus. That is also the limit of
      # what a green tick means: the marked suites -- a real model call, and the
      # marker checks against a real corpus -- are exactly the ones this cannot run,
      # and they still have to be run by hand (see CLAUDE.md, "Running the tests").
      - run: uv run pytest
